<!doctype html>
<meta charset="utf-8">
<title>Mermaid verification fixtures</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; color: #1a1c1f; }
  section { margin: 24px 0; }
  svg { max-width: 100%; height: auto; }
  #status { white-space: pre-wrap; }
</style>
<h1>Mermaid verification fixtures</h1>
<div id="status">Rendering…</div>
<div id="diagrams"></div>
<script src="../dist/engine.js"></script>
<script src="../dist/renderer.js"></script>
<script>
window.verify = async () => {
  const sources = await (await fetch('fixtures.json')).json();
  const results = [];
  for (let index = 0; index < sources.length; index += 1) {
    const result = await CodexMermaidRenderer.render(`fixture-${index}`, sources[index]);
    const section = document.createElement('section');
    section.innerHTML = result.svg;
    diagrams.append(section);
    const svg = section.querySelector('svg');
    results.push({
      index,
      viewBox: svg.getAttribute('viewBox'),
      nodes: svg.querySelectorAll('.node').length,
      edges: svg.querySelectorAll('.flowchart-link').length,
      labels: svg.querySelectorAll('.edgeLabel').length,
    });
  }
  window.results = results;
  document.getElementById('status').textContent = `Rendered ${results.length} fixtures`;
  return results;
};
window.verify().catch(error => {
  window.failure = error.stack || String(error);
  document.getElementById('status').textContent = window.failure;
});
</script>
